pluginManagement {
    repositories {
        maven {
            url nsRepository
            allowInsecureProtocol = true
        }
        maven {
            url nsSharedJarsRepository
            allowInsecureProtocol = true
        }
    }
    plugins {
        id "${quarkusPluginId}" version "${quarkusPluginVersion}"
    }
}

rootProject.name = 'leanix-arb-sync-service'
