# ─── Management service ────────────────────────────────────────────────────
# The schedule and the review teams are configuration, kept by leanix-management-service and read through its REST API with its
# API token (MANAGEMENT_API_TOKEN). The scheduler wakes up every minute and asks it whether the ARB_SYNC schedule is due.
quarkus.rest-client.management-service.url=${MANAGEMENT_SERVICE_URL:http://leanix-management-service:8080}
management-service.token=${MANAGEMENT_API_TOKEN}

# ─── API security ─────────────────────────────────────────────────────────────
# Every call under /api needs "Authorization: Bearer <API_TOKEN>". No default on purpose: the app fails at startup without it.
api.token=${API_TOKEN}

# ─── LeanIX ───────────────────────────────────────────────────────────────────
# No defaults for the host and token on purpose: the app fails at startup if they are not provided (LEANIX_HOST, LEANIX_API_TOKEN)
leanix.host=${LEANIX_HOST}
leanix.api.token=${LEANIX_API_TOKEN}
leanix.api.user=arbWorkflowUser
leanix.tag.arb-phase-open=8ab87f80-301c-46ac-a8c5-d0b302badae9

# REST client base URLs derive from leanix.host
quarkus.rest-client.leanix-auth.url=https://${leanix.host}
quarkus.rest-client.leanix-graphql.url=https://${leanix.host}

# ─── Datasource ───────────────────────────────────────────────────────────────
quarkus.datasource.db-kind=postgresql
# The PostgreSQL server is version 13; Hibernate assumes 14 unless told
quarkus.datasource.db-version=13.23.0
quarkus.datasource.username=arb_user
# Password: QUARKUS_DATASOURCE_PASSWORD
# This service has its own database, leanix_arb; its tables are in the arb schema
quarkus.datasource.jdbc.url=jdbc:postgresql://postgres:5432/leanix_arb?currentSchema=arb

# ─── Hibernate ────────────────────────────────────────────────────────────────
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.database.default-schema=arb
quarkus.hibernate-orm.log.sql=false

# ─── Flyway ───────────────────────────────────────────────────────────────────
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=arb
quarkus.flyway.default-schema=arb
quarkus.flyway.create-schemas=true
quarkus.flyway.locations=classpath:db/migration

# ─── Logging ──────────────────────────────────────────────────────────────────
quarkus.log.level=INFO
quarkus.log.category."com.nscorp.entarch".level=DEBUG

# ─── HTTP ─────────────────────────────────────────────────────────────────────
quarkus.http.port=8080
quarkus.rest-client.leanix-mtm.url=https://${leanix.host}
